name: M17 playtest

on:
  push:
    branches:
      - main
      - release/v1.0
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --run src/pdf/scienceOcr.test.ts
      - run: npm run typecheck
      - run: npm run build
