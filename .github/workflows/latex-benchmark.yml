name: LaTeX extraction benchmark

# Measures box-selection LaTeX extraction over the committed TeX corpus and
# fails if any tier's exact-match rate drops below its floor
# (src/science/research/latex/thresholds.json).

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run benchmark:latex
